[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "covert-reading-figures"
version = "1.0.0"
description = "Source Data figure reproduction for the Covert Reading manuscript"
requires-python = ">=3.9,<3.11"
dependencies = [
  "numpy==1.24.3",
  "pandas==1.5.3",
  "matplotlib==3.3.4",
  "scipy==1.11.1",
  "seaborn==0.12.0",
  "scikit-learn==1.1.2",
  "statsmodels==0.14.0",
  "openpyxl==3.1.5",
  "Pillow==9.4.0",
  "networkx==3.1",
]

[project.scripts]
covert-reading-figures = "covert_reading_figures.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
